server:
  port: 8082

spring:
  application:
    name: product-service

  # Cấu hình Spring Cache sử dụng Redis
  cache:
    type: redis

  # Cấu hình kết nối Redis
  data:
    redis:
      host: localhost
      port: 6379
      password: rikkeiacademy
      timeout: 60000ms

  # Cấu hình Database PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/product_db
    username: postgres
    password: 200426
    driver-class-name: org.postgresql.Driver

  # Cấu hình Hibernate / JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.example.productservice: DEBUG